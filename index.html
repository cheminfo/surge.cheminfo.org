<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Where this deployment is mounted. The build itself carries no mount —
         its assets are relative — so this is what resolves them, and what the
         page reads its own mount back off. The container rewrites it from
         BASE_PATH when it starts, which is how one image serves both
         surge.cheminfo.org and www.cheminfo.org/surge. It has to come before
         anything it resolves. -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The same geometry `react-cheminfo`'s `SiteMark` draws, written out with
         literal colours because a file served on its own cannot read the page's
         custom properties. Change one and change the other. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <meta name="theme-color" content="#4338ca" />
    <!-- The title, the description, the canonical address, the social card and
         the structured data are written here, per page, by `cheminfoPrerender`
         (see vite.config.ts). The page carries none of its own, so nothing can
         be duplicated and nothing has to be taken back out. -->
    <!--cheminfo:head-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- The crawl path for a reader with no JavaScript, written here by
         `cheminfoPrerender` with addresses relative to the `<base>` above, so
         they follow the mount the container stamps in. -->
    <!--cheminfo:body-->
  </body>
</html>
