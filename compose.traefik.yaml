# Traefik deployment — no port published on the host.
#
# Requires an external Docker network named `traefik` hosting the reverse
# proxy, with a `websecure` entrypoint and a `letsencrypt` cert resolver.
#
# Select with COMPOSE_FILE=compose.traefik.yaml in .env, then:
#   docker compose up -d

services:
  surge:
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/surge.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The pages served are written here at startup, so the analytics snippet can
    # go in them while the image filesystem stays read-only.
    tmpfs:
      - /public:rw,noexec,nosuid,size=128m
    environment:
      # Read from .env when there is one, defaulted here so a bare checkout
      # with no .env at all still starts. An empty value means "not set" to
      # the entrypoint: nothing is loaded.
      SERVER_PORT: ${PORT:-31228}
      TRACKING_SCRIPT: ${TRACKING_SCRIPT:-}
    mem_limit: 1g
    cpus: 2
    pids_limit: 256
    ulimits:
      core: 0
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    networks:
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.surge.rule=Host(`surge.cheminfo.org`)'
      - 'traefik.http.routers.surge.entrypoints=websecure'
      - 'traefik.http.routers.surge.tls.certresolver=letsencrypt'
      - 'traefik.http.services.surge.loadbalancer.server.port=${PORT:-31228}'

networks:
  traefik:
    external: true
